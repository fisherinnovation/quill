# Root of the Cargo workspace. This file has no [package] section, which makes
# it a "virtual manifest": it only groups the member crates so they share one
# Cargo.lock (identical dependency versions everywhere) and one target/ dir.
[workspace]
# Every directory under crates/ is a member, plus the Tauri app. Tauri depends
# on the library crates, never the other way round.
members = ["crates/*", "app/src-tauri"]
# Virtual manifests must choose the dependency resolver explicitly; "3" is the
# default for edition 2024.
resolver = "3"

# Metadata that member crates inherit with `version.workspace = true` etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/fisherinnovation/quill"

# Single place to pin third-party versions. A member opts in with
# `anyhow = { workspace = true }`, so versions can never drift between crates.
[workspace.dependencies]
anyhow = "1"
claxon = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
rubato = "5"
# Mic + system audio capture. On macOS 14.6+ an input stream on an *output*
# device records system audio via a Core Audio process tap; on Windows via
# WASAPI loopback.
cpal = "0.18"
# Lock-free single-producer/single-consumer ring buffer for audio callbacks.
rtrb = "0.4"
# macOS: which apps are using the microphone (Core Audio process objects),
# to notice calls starting. The versions cpal already uses.
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFString"] }
# macOS: floating panels that take clicks without activating the app (the
# app's floating.rs). The versions tauri already uses.
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSPanel", "NSWindow", "NSView", "NSResponder", "NSScreen", "NSEvent", "NSColor", "NSGraphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSArray", "NSBundle", "NSString"] }
# macOS: notifications when a meeting's notes are ready (the app's notify.rs).
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "0.6.2"
# Windows: the same notifications, as toasts.
windows = { version = "0.61", features = ["Foundation", "Data_Xml_Dom", "UI_Notifications"] }
# Pure-Rust port of WebRTC audio processing; we use its echo canceller (AEC3)
# to remove speaker sound picked up by the mic.
sonora = "0.2"
# `tracing_backend` routes whisper.cpp's own log output into `tracing`
# instead of letting it print straight to stderr.
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
# Speaker diarization (pyannote segmentation + speaker embeddings + clustering)
# through the official sherpa-onnx bindings. Pinned exactly: its build script
# downloads the matching prebuilt C++ libraries (onnxruntime included) from
# the sherpa-onnx GitHub release. Link mode is chosen per OS in quill-diarize.
sherpa-onnx = { version = "=1.13.8", default-features = false }
# Blocking client for model downloads; rustls means no OpenSSL dependency.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
sys-locale = "0.3"
sha2 = "0.11"
directories = "6"
indicatif = "0.18"
tempfile = "3"
# Async runtime for LLM calls. The CLI stays synchronous and starts a runtime
# only for commands that need one.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
arboard = "3.6"
# `async fn` in a trait used as `dyn LlmProvider` needs boxing; this macro
# writes that boilerplate (see quill-llm for details).
async-trait = "0.1"
enigo = "0.6"
flacenc = "0.5"
futures = "0.3"
# API keys live in the macOS Keychain / Windows Credential Manager.
keyring = "4"
# Read an API key from the terminal without echoing it.
rpassword = "7"
# Mock HTTP server for provider tests.
wiremock = "0.6"
# Dates and time zones (e.g. the local date in a summary title).
jiff = "0.2"
# SQLite, compiled in ("bundled") so there's no system library to install on
# Windows; includes FTS5 for transcript search.
rusqlite = { version = "0.40", features = ["bundled"] }
csv = "1"
toml = "1"
# Desktop app shell (the stable v2 line).
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-build = { version = "2.7", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-opener = "2.6"
# Downloads and installs signed app updates from GitHub Releases.
tauri-plugin-updater = "2.13"

# Our own crates, so members depend on each other with `x.workspace = true`.
quill-audio = { path = "crates/quill-audio" }
quill-core = { path = "crates/quill-core" }
quill-diarize = { path = "crates/quill-diarize" }
quill-insert = { path = "crates/quill-insert" }
quill-eval = { path = "crates/quill-eval" }
quill-llm = { path = "crates/quill-llm" }
quill-stt = { path = "crates/quill-stt" }

# Lints shared by every crate (each opts in with `[lints] workspace = true`).
# CI runs clippy with `-D warnings`, so every "warn" below fails the build.
[workspace.lints.rust]
# No `unsafe` outside FFI wrappers. "deny" (not "forbid") lets a
# future FFI module opt out locally with `#[allow(unsafe_code)]`.
unsafe_code = "deny"

[workspace.lints.clippy]
# No unwrap()/expect() outside tests and `main` setup. Tests are
# exempted in clippy.toml; `main` setup must opt in with a local #[allow].
unwrap_used = "warn"
expect_used = "warn"
# Every `unsafe` block needs a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
