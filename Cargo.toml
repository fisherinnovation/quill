# Root of the Cargo workspace. This file has no [package] section, which makes
# it a "virtual manifest": it only groups the member crates so they share one
# Cargo.lock (identical dependency versions everywhere) and one target/ dir.
[workspace]
# Every directory under crates/ is a member. The Tauri app in app/ is added
# explicitly in M5 so the library crates never depend on Tauri.
members = ["crates/*"]
# Virtual manifests must choose the dependency resolver explicitly; "3" is the
# default for edition 2024.
resolver = "3"

# Metadata that member crates inherit with `version.workspace = true` etc.
[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Single place to pin third-party versions. A member opts in with
# `anyhow = { workspace = true }`, so versions can never drift between crates.
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
rubato = "5"
# Mic + system audio capture. On macOS 14.6+ an input stream on an *output*
# device records system audio via a Core Audio process tap; on Windows via
# WASAPI loopback.
cpal = "0.18"
# Lock-free single-producer/single-consumer ring buffer for audio callbacks.
rtrb = "0.4"
# `tracing_backend` routes whisper.cpp's own log output into `tracing`
# instead of letting it print straight to stderr.
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
# Blocking client for model downloads; rustls means no OpenSSL dependency.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.11"
directories = "6"
indicatif = "0.18"
tempfile = "3"

# Our own crates, so members depend on each other with `x.workspace = true`.
quill-audio = { path = "crates/quill-audio" }
quill-core = { path = "crates/quill-core" }
quill-stt = { path = "crates/quill-stt" }

# Lints shared by every crate (each opts in with `[lints] workspace = true`).
# CI runs clippy with `-D warnings`, so every "warn" below fails the build.
[workspace.lints.rust]
# Section 6: no `unsafe` outside FFI wrappers. "deny" (not "forbid") lets a
# future FFI module opt out locally with `#[allow(unsafe_code)]`.
unsafe_code = "deny"

[workspace.lints.clippy]
# Section 6: no unwrap()/expect() outside tests and `main` setup. Tests are
# exempted in clippy.toml; `main` setup must opt in with a local #[allow].
unwrap_used = "warn"
expect_used = "warn"
# Section 6: every `unsafe` block needs a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
