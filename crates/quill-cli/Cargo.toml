[package]
name = "quill-cli"
description = "Command-line front end for Quill's library crates"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true

# `x.workspace = true` takes the version and features from the root Cargo.toml.
[dependencies]
anyhow.workspace = true
clap.workspace = true
indicatif.workspace = true
jiff.workspace = true
quill-audio.workspace = true
quill-core.workspace = true
quill-diarize.workspace = true
quill-embed.workspace = true
quill-eval.workspace = true
quill-llm.workspace = true
quill-mcp.workspace = true
quill-stt.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Pass-through GPU backends for Windows/Linux (macOS always gets Metal).
[features]
cuda = ["quill-stt/cuda"]
vulkan = ["quill-stt/vulkan"]

[lints]
workspace = true
