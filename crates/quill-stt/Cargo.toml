[package]
name = "quill-stt"
description = "Speech-to-text: the Transcriber trait, with Whisper (whisper-rs) and Parakeet (sherpa-onnx)"
version.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
whisper-rs.workspace = true
whisper-rs-sys.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Parakeet runs through sherpa-onnx, linked as quill-diarize links it: static
# on macOS, DLLs on Windows (below: the static build's /MT runtime can't link
# alongside whisper.cpp's /MD objects).
[target.'cfg(not(windows))'.dependencies]
sherpa-onnx = { workspace = true, features = ["static"] }

# On macOS, always build whisper.cpp with Metal (Apple GPU). A dependency listed
# again under a target table merges its features with the entry above, so this
# adds `metal` only when compiling for macOS. `--cpu` on the CLI still lets you
# compare against CPU-only at runtime.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { workspace = true, features = ["metal"] }

# On Windows, always build it with Vulkan, which runs on Nvidia, AMD and Intel
# GPUs alike. Building needs the Vulkan SDK (scripts/install-vulkan-sdk.sh sets
# it up); running needs only the loader, vulkan-1.dll, which GPU drivers
# install and the release ships besides. With no usable GPU, whisper.cpp falls
# back to the CPU.
[target.'cfg(windows)'.dependencies]
whisper-rs = { workspace = true, features = ["vulkan"] }
sherpa-onnx = { workspace = true, features = ["shared"] }

# CUDA (Nvidia only) is opt-in, as is Vulkan elsewhere. Both need their SDK
# installed. Example: `cargo build -p quill-cli --features cuda`.
[features]
cuda = ["whisper-rs/cuda"]
vulkan = ["whisper-rs/vulkan"]

[dev-dependencies]
quill-audio.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
