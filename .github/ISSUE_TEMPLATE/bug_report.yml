name: Bug report
description: Something in Quill doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For security issues, please don't open an issue: see [SECURITY.md](https://github.com/fisherinnovation/quill/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: version
    attributes:
      label: Quill version
      description: In About Quill, or "Copy diagnostic info" there.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and hardware
      placeholder: macOS 26.6, MacBook Pro M3 / Windows 11, Intel i7
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: |
        From Settings → Troubleshooting → Log files. Logs never contain transcripts, notes, dictated text or keys, but please glance over what you paste.
      render: text
