name: Release

# Builds installable Quill packages:
# - a tag push (v1.2.3, matching the app version) builds them and attaches
#   them to a draft GitHub Release to review and publish;
# - running the workflow by hand builds them as downloadable artifacts only.
#
# Builds are unsigned (macOS: ad hoc) until signing secrets are configured;
# see the README's Installing section for what that means for users.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # whisper.cpp otherwise builds for the runner's own CPU (GGML_NATIVE), and
  # the Windows runners have AVX-512, which most desktop CPUs lack: the app
  # then dies with an illegal instruction on the first dictation. Off, ggml
  # targets a portable baseline (AVX2/FMA/F16C on x64). whisper-rs-sys passes
  # GGML_* variables through to CMake.
  GGML_NATIVE: "OFF"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: Windows (x64)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Separate from CI's cache: release builds use another profile. Change
      # the key whenever a GGML_* setting changes: whisper-rs-sys doesn't
      # rebuild when they do, so a cached whisper.cpp would be reused.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-portable-cpu

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the app version $version (app/src-tauri/tauri.conf.json)"
            exit 1
          fi

      # Prebuilt sherpa-onnx libraries (speaker diarization), hash-checked.
      - name: sherpa-onnx libraries
        shell: bash
        run: echo "SHERPA_ONNX_LIB_DIR=$(scripts/fetch-sherpa-onnx.sh "$RUNNER_TEMP/sherpa-onnx")" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          npx tauri build --bundles app
          sh scripts/package-macos.sh

      # On Windows sherpa-onnx is a set of DLLs; the installer puts them next
      # to the executable (tauri.windows-release.conf.json).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        shell: bash
        run: |
          lib=$(cygpath -u "$SHERPA_ONNX_LIB_DIR")
          mkdir -p src-tauri/windows-libs
          for dll in sherpa-onnx-c-api.dll onnxruntime.dll onnxruntime_providers_shared.dll; do
            cp "$lib/$dll" src-tauri/windows-libs/
          done
          npx tauri build --bundles nsis,msi --config src-tauri/tauri.windows-release.conf.json
          mkdir -p ../dist-release
          cp ../target/release/bundle/nsis/*.exe ../target/release/bundle/msi/*.msi ../dist-release/

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: quill-${{ runner.os }}
          path: dist-release/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create a draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Quill ${GITHUB_REF_NAME#v}" \
            --generate-notes
