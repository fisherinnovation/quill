name: Release

# Builds installable Quill packages:
# - a tag push (v1.2.3, matching the app version) builds them and attaches
#   them to a draft GitHub Release to review and publish;
# - running the workflow by hand builds them as downloadable artifacts only.
#
# Each release also carries latest.json and the signed files the in-app
# updater installs (app/src-tauri/src/updates.rs). Installed copies of Quill
# see a release only once it's published, never while it's a draft.
#
# Builds are unsigned (macOS: ad hoc) until signing secrets are configured;
# see the README's Installing section for what that means for users.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # whisper.cpp otherwise builds for the runner's own CPU (GGML_NATIVE), and
  # the Windows runners have AVX-512, which most desktop CPUs lack: the app
  # then dies with an illegal instruction on the first dictation. Off, ggml
  # targets a portable baseline (AVX2/FMA/F16C on x64). whisper-rs-sys passes
  # GGML_* variables through to CMake.
  GGML_NATIVE: "OFF"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
          - name: Windows (x64)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Separate from CI's cache: release builds use another profile. Change
      # the key whenever a GGML_* setting changes: whisper-rs-sys doesn't
      # rebuild when they do, so a cached whisper.cpp would be reused.
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-portable-cpu

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the app version $version (app/src-tauri/tauri.conf.json)"
            exit 1
          fi

      # Prebuilt sherpa-onnx libraries (speaker diarization), hash-checked.
      - name: sherpa-onnx libraries
        shell: bash
        run: echo "SHERPA_ONNX_LIB_DIR=$(scripts/fetch-sherpa-onnx.sh "$RUNNER_TEMP/sherpa-onnx")" >> "$GITHUB_ENV"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          npx tauri build --bundles app
          sh scripts/package-macos.sh

      # On Windows sherpa-onnx is a set of DLLs; the installer puts them next
      # to the executable (tauri.windows-release.conf.json).
      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: app
        shell: bash
        run: |
          lib=$(cygpath -u "$SHERPA_ONNX_LIB_DIR")
          mkdir -p src-tauri/windows-libs
          for dll in sherpa-onnx-c-api.dll onnxruntime.dll onnxruntime_providers_shared.dll; do
            cp "$lib/$dll" src-tauri/windows-libs/
          done
          npx tauri build --bundles nsis,msi --config src-tauri/tauri.windows-release.conf.json
          mkdir -p ../dist-release
          cp ../target/release/bundle/nsis/*.exe ../target/release/bundle/msi/*.msi ../dist-release/

      # Signs the files the in-app updater downloads with the updater key
      # (minisign, checked against the public key in tauri.conf.json), and
      # binds each signature to this version.
      - name: Sign the update files
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "::error::the TAURI_SIGNING_PRIVATE_KEY secret is missing; releases need it for updates"
              exit 1
            fi
            echo "::warning::no updater key; update files are unsigned"
            exit 0
          fi
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          for file in ../dist-release/*.app.tar.gz ../dist-release/*.exe ../dist-release/*.msi; do
            [ -e "$file" ] || continue
            npx tauri signer sign --app-version "$version" "$file" > /dev/null
            echo "Signed $(basename "$file")"
          done

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: quill-${{ runner.os }}
          path: dist-release/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      # What the updater reads: each platform's file and signature. Keys
      # are {os}-{arch}-{installer}, falling back to {os}-{arch}, so
      # Windows copies installed from the .msi update with the .msi.
      - name: Write latest.json for the updater
        shell: bash
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          entry() {
            local file
            file=$(cd dist && ls $1)
            jq -n --arg url "$base/$file" --rawfile sig "dist/$file.sig" '{url: $url, signature: ($sig | rtrimstr("\n"))}'
          }
          mac=$(entry '*.app.tar.gz')
          nsis=$(entry '*-setup.exe')
          msi=$(entry '*.msi')
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" \
            --argjson mac "$mac" --argjson nsis "$nsis" --argjson msi "$msi" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {
              "darwin-aarch64": $mac, "darwin-aarch64-app": $mac,
              "windows-x86_64": $nsis, "windows-x86_64-nsis": $nsis, "windows-x86_64-msi": $msi
            }}' > dist/latest.json
          cat dist/latest.json
          rm dist/*.sig

      - name: Create a draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Quill ${GITHUB_REF_NAME#v}" \
            --generate-notes
