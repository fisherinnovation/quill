name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      # Report both OSes even if one fails; platform-specific breakage is the
      # main thing this matrix exists to catch.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and target/ between runs, keyed on Cargo.lock.
      - uses: Swatinem/rust-cache@v2

      # Prebuilt sherpa-onnx libraries for diarization, checked against
      # pinned hashes. (Left to itself, the crate's build script downloads
      # them unchecked into target/, where a restored cache can leave them
      # incomplete.)
      - name: sherpa-onnx libraries
        shell: bash
        run: echo "SHERPA_ONNX_LIB_DIR=$(scripts/fetch-sherpa-onnx.sh "$RUNNER_TEMP/sherpa-onnx")" >> "$GITHUB_ENV"

      # whisper.cpp's Vulkan backend (Windows) builds against the Vulkan SDK,
      # hash-checked. Bin/ holds glslc, which compiles its shaders.
      - name: Vulkan SDK
        if: runner.os == 'Windows'
        shell: bash
        run: |
          sdk=$(scripts/install-vulkan-sdk.sh)
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "$sdk\Bin" >> "$GITHUB_PATH"

      # The Tauri app embeds the built frontend (app/dist) at compile time,
      # so it must exist before any cargo step that compiles quill-app.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend (type-check + build)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all --check

      # --all-targets also lints tests; --locked fails if Cargo.lock is stale.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  # The website (site/): built on every run. Pushes to main publish it to
  # GitHub Pages once the repository variable SITE_DEPLOY is "true" (set it
  # after enabling Pages, with GitHub Actions as the source).
  site:
    name: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Download buttons need a published release; source links need the
      # repository to be public. The site follows both on its own.
      - name: Release and visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "QUILL_SITE_PUBLIC=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private | not')" >> "$GITHUB_ENV"
          if gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > "$RUNNER_TEMP/release.json"; then
            echo "QUILL_SITE_RELEASE=$RUNNER_TEMP/release.json" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          QUILL_SITE_URL: https://fisherinnovation.github.io/quill/
        run: node site/build.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy-site:
    name: publish website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
