name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when a newer commit lands on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      # Report both OSes even if one fails; platform-specific breakage is the
      # main thing this matrix exists to catch.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo and target/ between runs, keyed on Cargo.lock.
      - uses: Swatinem/rust-cache@v2

      # Prebuilt sherpa-onnx libraries for diarization, checked against
      # pinned hashes. (Left to itself, the crate's build script downloads
      # them unchecked into target/, where a restored cache can leave them
      # incomplete.)
      - name: sherpa-onnx libraries
        shell: bash
        run: echo "SHERPA_ONNX_LIB_DIR=$(scripts/fetch-sherpa-onnx.sh "$RUNNER_TEMP/sherpa-onnx")" >> "$GITHUB_ENV"

      # The Tauri app embeds the built frontend (app/dist) at compile time,
      # so it must exist before any cargo step that compiles quill-app.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Frontend (type-check + build)
        working-directory: app
        run: |
          npm ci
          npm run build

      - name: Format
        run: cargo fmt --all --check

      # --all-targets also lints tests; --locked fails if Cargo.lock is stale.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked
