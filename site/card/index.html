<!doctype html>
<!-- The link preview image (og:image), rendered to site/media/card.jpg by
     render.mjs at 1200×630. Previews show it small, so the type is big. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Quill card</title>
    <style>
      :root {
        --bg: #f4f3f0;
        --text: #121218;
        --text-2: #5c5c66;
        --accent: #ff1053;
        --line: #e8e6e1;
        --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Inter,
          Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: radial-gradient(900px 500px at 85% 20%, #ffe0e8 0%, transparent 60%), var(--bg);
        color: var(--text);
        font-family: var(--font);
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 64px;
        width: 560px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin-top: 64px;
        font-size: 76px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.035em;
      }
      .accent {
        color: var(--accent);
      }
      p {
        margin-top: 36px;
        font-size: 30px;
        line-height: 1.3;
        color: var(--text-2);
      }
      .shot {
        position: absolute;
        left: 690px;
        top: 72px;
        width: 780px;
        border-radius: 22px;
        border: 1px solid var(--line);
        box-shadow:
          0 2px 6px rgb(18 18 24 / 0.06),
          0 24px 60px rgb(18 18 24 / 0.14);
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand"><img src="../../app/app-icon.svg" alt="" />Quill</div>
      <h1><span class="accent">Meeting notes</span><br />without the meeting bot</h1>
      <p>Private AI notes and dictation for macOS and Windows. Audio never leaves your computer.</p>
    </div>
    <img class="shot" src="../media/hero-light.jpg" alt="" />
  </body>
</html>
